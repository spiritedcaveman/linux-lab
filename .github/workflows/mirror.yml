name: Linux Lab Sync

on:
  schedule:
    - cron: "*/7 * * * *" 
  workflow_dispatch:      

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Force Sync All Tags and Branches
        run: |
          git clone --mirror https://github.com/torvalds/linux.git kernel.git
          cd kernel.git
          git remote add codeberg https://${{ secrets.CODEBERG_TOKEN }}@codeberg.org/spiritedcaveman/linux-lab.git
          
          # Push all tags and all refs/branches cleanly
          git push --force codeberg --tags
          git push --force codeberg 'refs/heads/*:refs/heads/*'
